templates:
    1: &auto
        type: float
        subgrades:
            points: integer
        calculation: (points >= 9) && points || 0
        automatic:
            points: (correctness_score * 10).floor
        auto_publish: true
        hide_calculated: false
        hide_subgrades: false

    2: &check
        type: pass
        subgrades:
            passed: boolean
        calculation: passed
        auto_publish: true
        hide_calculated: true
        hide_subgrades: false

    3: &testt
        type: pass
        subgrades:
            passed: boolean
            checkpy: float
        automatic:
            checkpy: correctness_score * 10
        calculation: passed
        auto_publish: false
        hide_calculated: true
        hide_subgrades: false


